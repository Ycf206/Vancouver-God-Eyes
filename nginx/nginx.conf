# 隱藏 Nginx 版本號，防止洩漏伺服器指紋資訊
server_tokens off;

# 優先識別 Cloudflare 真實訪客 IP，避免將同一 CDN 邊緣節點的大量使用者誤判為單一 IP 限流
map $http_cf_connecting_ip $client_rate_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# 全域防濫用與抗 DDoS 速率與連線數限制區 (Shared Memory Zones)
limit_req_zone  $client_rate_key zone=api_general_limit:20m rate=25r/s;
limit_req_zone  $client_rate_key zone=api_heavy_limit:10m   rate=8r/s;
limit_req_zone  $client_rate_key zone=admin_login_limit:10m rate=5r/m;
limit_conn_zone $client_rate_key zone=conn_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

# ==========================================
# 0. Upstream 連線池與 Keepalive 持久連線優化
# ==========================================
upstream backend_nodes {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream frontend_nodes {
    least_conn;
    server frontend:3000 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

# ==========================================
# 1. 獨立管理後台 Subdomain (admin.vangodseye.fyi)
# ==========================================
server {
    listen 80;
    server_name admin.vangodseye.fyi;

    # ------------------------------------------------------------------
    # [進階防護選項 A] 固定 IP 白名單鎖定 (取消註解並填入您的 IP 即可啟用)
    # allow 203.0.113.10;
    # deny all;
    #
    # [進階防護選項 B] mTLS 雙向憑證認證 (搭配 scripts/setup_admin_mtls_cert.sh)
    # ssl_client_certificate /etc/nginx/certs/ca.crt;
    # ssl_verify_client on;
    # ------------------------------------------------------------------

    # Gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/geo+json;

    # 嚴格安全標頭與搜尋引擎隱藏
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none';" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 25M;
    limit_conn conn_per_ip 30;

    # 封鎖敏感隱藏檔案探測 (.env, .git 等)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # 後台登入端點嚴格防暴力破解限流 (每分鐘最多 5 次，突發容許 3 次)
    location = /api/admin/auth/login {
        limit_req zone=admin_login_limit burst=3 nodelay;
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # 後台 API 代理 (高優先順序前綴匹配)
    location ^~ /api/ {
        limit_req zone=api_general_limit burst=40 nodelay;
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
    }

    location = /api {
        return 308 /api/;
    }

    # 後端 WebSocket 代理
    location /ws {
        proxy_pass http://backend_nodes/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 後台頁面 Next.js 代理 (由 Next.js middleware 自動映射至 /admin)
    location / {
        proxy_pass http://frontend_nodes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ==========================================
# 2. 前端主網站 (vangodseye.fyi & www)
# ==========================================
server {
    listen 80;
    server_name vangodseye.fyi www.vangodseye.fyi localhost _;

    # Gzip compression for faster loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/geo+json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self';" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), usb=()" always;

    # Client body size & per-IP connection limits
    client_max_body_size 10M;
    limit_conn conn_per_ip 60;

    # 封鎖敏感隱藏檔案探測 (.env, .git 等)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # 主站徹底隔離並隱藏 /admin、/api/admin、/api/debug 與 API 文件路徑 (回傳 404 不洩漏後台子網域)
    location ^~ /admin {
        return 404;
    }

    location ^~ /api/admin {
        return 404;
    }

    location ^~ /api/debug {
        return 404;
    }

    location = /docs {
        return 404;
    }

    location = /redoc {
        return 404;
    }

    location = /openapi.json {
        return 404;
    }

    # 高消耗搜尋、回報與代理 API 獨立限流保護
    location ~ ^/api/(search|explore/nearby|report-issue|webcam/|jobs/|geocode) {
        limit_req zone=api_heavy_limit burst=20 nodelay;
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
    }

    # Backend API proxy (高優先順序前綴匹配)
    location ^~ /api/ {
        limit_req zone=api_general_limit burst=60 nodelay;
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
    }

    # Live traffic WebSocket proxy
    location /ws {
        proxy_pass http://backend_nodes/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Backend health check
    location /health {
        proxy_pass http://backend_nodes/health;
        proxy_set_header Host $host;
    }

    # Next.js 構建靜態檔案快取 (365天 immutable 永久快取)
    location /_next/static/ {
        proxy_pass http://frontend_nodes;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 靜態 GeoJSON 圖層快取 (5分鐘快取 + 支援條件式請求，降低伺服器負載)
    location ~* \.geojson$ {
        proxy_pass http://frontend_nodes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # 動態 JSON 資料 (3-1-1 市政服務、特價海報、系統維護等) 禁用長期快取，保證資料即時更新
    location ~* \.json$ {
        proxy_pass http://frontend_nodes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 靜態圖片與字型快取 (7天快取)
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff|ttf|eot)$ {
        proxy_pass http://frontend_nodes;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Frontend Next.js proxy
    location / {
        proxy_pass http://frontend_nodes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

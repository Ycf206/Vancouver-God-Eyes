name: Update 大統華每週特價海報 (每週五)

on:
  schedule:
    - cron: '0 9 * * 5'
  workflow_dispatch:

concurrency:
  group: update-tnt-eflyers
  cancel-in-progress: true

jobs:
  update-tnt-eflyers:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Layer Sync Script (大統華每週特價海報)
        run: |
          python backend/scripts/layers/update_tnt_eflyers.py

      - name: Commit and Push Updated Data
        id: git_push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/tnt_eflyers.json frontend/public/tnt_eflyers.json
          if git diff --staged --quiet; then
            echo "No updates detected for 大統華每週特價海報."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): auto-update 大統華每週特價海報 [skip ci]"
            git push origin HEAD:data --force
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync Updated Data to OCI VM
        if: steps.git_push.outputs.has_changes == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "🔄 同步最新 大統華每週特價海報 圖資至 OCI 伺服器..."
            cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
            git fetch origin data 2>/dev/null || true
            git checkout origin/data -- backend/data frontend/public 2>/dev/null || true
            mkdir -p backend/data frontend/public
            sudo docker compose restart backend || sudo docker-compose restart backend || true
            echo "✅ OCI 伺服器 大統華每週特價海報 圖資同步完成！"

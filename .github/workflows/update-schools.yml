name: Semi-Annual Schools Update (學校資料每6個月更新)

on:
  schedule:
    # 每年 1 月 1 日與 7 月 1 日 03:00 UTC (每 6 個月一次)
    - cron: '0 0 1 */6 *'
  workflow_dispatch:

jobs:
  update-schools:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Schools Update Script (VSB API 合併)
        run: |
          node scripts/update_schools.mjs

      - name: Commit and Push Updated Schools GeoJSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/vancouver_schools.geojson frontend/public/vancouver_schools.geojson
          if git diff --staged --quiet; then
            echo "No school updates detected from VSB API."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): auto-update schools dataset via VSB API (6-month cron) [skip ci]"
            git push origin main
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        id: git_push

      - name: Sync Updated GeoJSON to OCI VM
        if: steps.git_push.outputs.has_changes == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "🔄 同步最新學校資料至 OCI 伺服器..."
            cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
            git pull
            echo "✅ OCI 伺服器學校資料檔案同步完成！"

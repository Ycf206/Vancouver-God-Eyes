name: "Update 公共服務 (每1個月)"

on:
  schedule:
    - cron: '45 4 1 * *'
  workflow_dispatch:

concurrency:
  group: update-public-services
  cancel-in-progress: true

jobs:
  update-public-services:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest layer cache from data branch
        run: |
          git fetch origin data:refs/remotes/origin/data 2>/dev/null || true
          git checkout refs/remotes/origin/data -- backend/data/canada_public_services.json frontend/public/canada_public_services.json 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run update script (公共服務 / Canada Service Map)
        run: |
          python backend/scripts/layers/update_public_services.py

      - name: Commit and push updated data to data branch
        id: git_push
        run: |
          set -e
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          mkdir -p /tmp/wf_stage
          for f in backend/data/canada_public_services.json frontend/public/canada_public_services.json; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/wf_stage/$(dirname "$f")"
              cp -f "$f" "/tmp/wf_stage/$f"
            fi
          done

          git reset --hard HEAD
          git clean -fd

          has_changes="false"
          for attempt in 1 2 3 4 5; do
            git fetch origin data:refs/remotes/origin/data 2>/dev/null || true
            if git show-ref --verify --quiet refs/remotes/origin/data; then
              git checkout -f -B data refs/remotes/origin/data
            else
              git checkout -f -B data
            fi

            for f in backend/data/canada_public_services.json frontend/public/canada_public_services.json; do
              if [ -f "/tmp/wf_stage/$f" ]; then
                mkdir -p "$(dirname "$f")"
                cp -f "/tmp/wf_stage/$f" "$f"
              fi
            done

            git add backend/data/canada_public_services.json frontend/public/canada_public_services.json
            if git diff -I '"updated_at"' --staged --quiet; then
              echo "No substantive changes detected for 公共服務."
              git reset --hard HEAD >/dev/null 2>&1 || true
              has_changes="false"
              break
            fi

            git commit -m "chore(data): auto-update 公共服務 (Canada Service Map) [skip ci]"
            if git push origin HEAD:data; then
              has_changes="true"
              break
            fi

            echo "Push conflict on data branch (attempt $attempt), retrying..."
            sleep $((attempt * 2))
          done

          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

      - name: Sync data and update timestamp on OCI VM
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ~/vancouver-gods-eye || exit 1
            git fetch origin data:refs/remotes/origin/data 2>/dev/null || true
            git checkout refs/remotes/origin/data -- backend/data/canada_public_services.json frontend/public/canada_public_services.json 2>/dev/null || true
            docker cp backend/data/canada_public_services.json vancouver-gods-eye-backend-1:/app/data/canada_public_services.json 2>/dev/null || true
            docker cp frontend/public/canada_public_services.json vancouver-gods-eye-frontend-1:/app/public/canada_public_services.json 2>/dev/null || true
            curl -s -X POST "http://127.0.0.1:8000/api/admin/sources/public_services/webhook-sync" >/dev/null 2>&1 || true

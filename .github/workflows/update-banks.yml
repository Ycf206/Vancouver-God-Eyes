name: Update 銀行 (Banks) (每月)

on:
  schedule:
    # 每月 1 號 00:00 UTC 執行一次
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: update-banks
  cancel-in-progress: true

jobs:
  update-banks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Latest GeoJSON Cache from data branch
        run: |
          mkdir -p backend/data frontend/public
          git fetch origin data:refs/remotes/origin/data 2>/dev/null || true
          git checkout origin/data -- backend/data/vancouver_banks.geojson frontend/public/vancouver_banks.geojson 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests curl_cffi

      - name: Run 銀行 (Banks) update script
        run: |
          python backend/scripts/layers/update_banks.py

      - name: Commit and push changes
        id: git_push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add backend/data/vancouver_banks.geojson frontend/public/vancouver_banks.geojson
          if git diff --staged --quiet; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): auto-update 溫哥華銀行 (Banks) dataset [skip ci]"
            git push origin HEAD:data --force
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync Updated Data to OCI VM
        if: steps.git_push.outputs.has_changes == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "🔄 同步最新 銀行 圖資至 OCI 伺服器..."
            cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
            git fetch origin data 2>/dev/null || true
            git checkout origin/data -- backend/data frontend/public 2>/dev/null || true
            mkdir -p backend/data frontend/public
            sudo docker compose restart backend || sudo docker-compose restart backend || true
            echo "✅ OCI 伺服器 銀行 圖資同步完成！"

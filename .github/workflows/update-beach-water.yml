name: Update Metro Vancouver 泳灘水質監測 (每 6 小時)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: update-beach-water
  cancel-in-progress: true

jobs:
  update-beach-water:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Layer Sync Script (Metro Vancouver 泳灘水質監測)
        run: |
          python backend/scripts/layers/update_beach_water.py

      - name: Commit and Push Updated GeoJSON
        id: git_push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/vancouver_beach_water.geojson frontend/public/vancouver_beach_water.geojson
          if git diff --staged --quiet; then
            echo "No updates detected for Metro Vancouver 泳灘水質監測."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): auto-update Metro Vancouver 泳灘水質監測 dataset [skip ci]"
            git push origin main
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync Updated GeoJSON to OCI VM
        if: steps.git_push.outputs.has_changes == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "🔄 同步最新 Metro Vancouver 泳灘水質監測 圖資至 OCI 伺服器..."
            cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
            git pull
            echo "✅ OCI 伺服器 Metro Vancouver 泳灘水質監測 圖資同步完成！"

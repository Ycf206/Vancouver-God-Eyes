name: Daily Food Vendors Update (食品攤販每天更新1次)

on:
  schedule:
    # 每天 14:00 UTC (溫哥華上午 06:00 / 07:00) 自動爬取更新
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  update-food-vendors:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Food Vendors Update Script (StreetFoodApp 爬蟲)
        run: |
          node scripts/update_food_vendors.mjs

      - name: Commit and Push Updated Food Vendors GeoJSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/vancouver_food_vendors.geojson frontend/public/vancouver_food_vendors.geojson
          if git diff --staged --quiet; then
            echo "No food vendor updates detected."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): auto-update food vendors dataset via StreetFoodApp (daily cron) [skip ci]"
            git push origin main
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        id: git_push

      - name: Sync Updated GeoJSON to OCI VM
        if: steps.git_push.outputs.has_changes == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "🔄 同步最新食品攤販資料至 OCI 伺服器..."
            cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
            git pull
            echo "✅ OCI 伺服器食品攤販資料檔案同步完成！"

name: Update FedEx 門市與自取據點 (每月更新 1 次)

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

concurrency:
  group: update-fedex
  cancel-in-progress: true

jobs:
  update-fedex:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Layer Sync Script (FedEx)
        run: |
          python backend/scripts/layers/update_fedex.py

      - name: Commit and Push Updated GeoJSON
        id: git_push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/vancouver_fedex.geojson frontend/public/vancouver_fedex.geojson
          if git diff --staged --quiet; then
            echo "No updates detected for FedEx."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): auto-update FedEx locations [skip ci]"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git push
          fi

      - name: Sync Updated Data to OCI VM
        if: steps.git_push.outputs.has_changes == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "🔄 同步最新 FedEx 門市據點 圖資至 OCI 伺服器..."
            cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
            git pull origin main 2>/dev/null || true
            mkdir -p backend/data frontend/public
            sudo docker compose restart backend || sudo docker-compose restart backend || true
            echo "✅ OCI 伺服器 FedEx 門市據點 圖資同步完成！"

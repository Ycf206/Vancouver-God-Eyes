name: Update Canada Post 郵政據點 (每季 (3 個月))

on:
  schedule:
    - cron: '0 0 1 */3 *'
  workflow_dispatch:

concurrency:
  group: update-canada-post
  cancel-in-progress: true

jobs:
  update-canada-post:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Layer Sync Script (Canada Post)
        run: |
          python backend/scripts/layers/update_canada_post.py

      - name: Commit and Push Updated GeoJSON
        id: git_push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/vancouver_canada_post.geojson frontend/public/vancouver_canada_post.geojson
          if git diff --staged --quiet; then
            echo "No updates detected for Canada Post."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): auto-update Canada Post dataset [skip ci]"
            git push origin main
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync Updated GeoJSON to OCI VM
        if: steps.git_push.outputs.has_changes == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "🔄 同步最新 Canada Post 圖資至 OCI 伺服器..."
            cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
            git pull origin main
            mkdir -p backend/data
            cp -f backend/data/vancouver_canada_post.geojson backend/data/ 2>/dev/null || true
            sudo docker compose restart backend || sudo docker-compose restart backend || true
            echo "✅ Canada Post OCI 同步完成！"

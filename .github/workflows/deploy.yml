name: Deploy to OCI VM

on:
  push:
    branches: 
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Execute SSH commands on OCI VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.OCI_HOST_IP }}
        username: ubuntu
        key: ${{ secrets.OCI_SSH_KEY }}
        # 如果您的防線有設定 port，可以使用 port: ${{ secrets.OCI_SSH_PORT }}，預設為 22
        script: |
          # 嘗試進入資料夾 (根據您截圖中的資料夾名稱)
          cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
          
          # 更新程式碼
          git pull
          
          # 重新建置並啟動 Docker 容器
          docker compose up -d --build

name: Deploy to OCI VM

on:
  push:
    branches: 
      - main
      - master
    paths-ignore:
      - '.github/workflows/update-*.yml'
      - '.github/workflows/oci-monthly-sync.yml'
      - '.github/workflows/weekly-datasets.yml'
      - 'backend/data/admin_sources_config.json'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      rollback_target:
        description: '緊急系統還原目標 (可輸入 Git Commit SHA、Tag 如 v2026.11.0，或 PREV 代表還原上一版本；留空則部署最新 main)'
        required: false
        default: ''

concurrency:
  group: deploy-oci-vm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Execute SSH commands on OCI VM
      uses: appleboy/ssh-action@v1.0.3
      env:
        TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        ROLLBACK_TARGET: ${{ github.event.inputs.rollback_target }}
      with:
        host: ${{ secrets.OCI_HOST_IP }}
        username: ubuntu
        key: ${{ secrets.OCI_SSH_KEY }}
        envs: TOMTOM_API_KEY,ADMIN_API_SECRET,ADMIN_PASSWORD,ROLLBACK_TARGET
        script: |
          set -e
          cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
          
          echo "Working directory: $(pwd)"
          
          # 備份保護本機 .env、前端環境變數與所有後台持久化執行狀態檔 (防止 git reset / origin/data 覆蓋)
          [ -f .env ] && cp .env /tmp/godseye_root_env.bak || true
          [ -f backend/.env ] && cp backend/.env /tmp/godseye_backend_env.bak || true
          [ -f frontend/.env.local ] && cp frontend/.env.local /tmp/godseye_frontend_env.bak || true
          [ -f backend/data/admin_sources_config.json ] && cp backend/data/admin_sources_config.json /tmp/godseye_admin_cfg.bak || true
          mkdir -p /tmp/godseye_runtime_bak
          for rt_file in admin_schedule_history.json schedule_history_config.json system_logs.json system_logs_config.json stats_pv.json issue_reports.jsonl .admin_session_key system_maintenance.json admin_layers_config.json; do
            [ -f "backend/data/$rt_file" ] && cp -f "backend/data/$rt_file" "/tmp/godseye_runtime_bak/$rt_file" || true
          done

          # 檢查是否有指定緊急系統還原目標
          if [ -n "$ROLLBACK_TARGET" ]; then
            echo "🚨 啟動緊急系統還原程序，目標：$ROLLBACK_TARGET ..."
            git fetch --all --tags
            if [ "$ROLLBACK_TARGET" = "PREV" ]; then
              git checkout HEAD~1
            else
              git checkout "$ROLLBACK_TARGET"
            fi
            echo "✅ 已切換至還原版本：$(git rev-parse HEAD)"
          else
            # 強制同步至遠端最新 commit，徹底避免本機快取與衝突阻止更新
            git fetch origin main
            git checkout main
            git reset --hard origin/main
          fi
          git fetch origin data:refs/remotes/origin/data 2>/dev/null || true
          git checkout refs/remotes/origin/data -- backend/data frontend/public 2>/dev/null || true
          # 確保核心圖資與後台設定以最新 main 分支為基準，防止 data 分支舊快取損壞屬性與格式
          git checkout HEAD -- \
            backend/data/vancouver_airports.geojson \
            frontend/public/vancouver_airports.geojson \
            backend/data/vancouver_yvr_flights.json \
            frontend/public/vancouver_yvr_flights.json \
            backend/data/vancouver_bikeways.geojson \
            frontend/public/vancouver_bikeways.geojson \
            backend/data/vancouver_community_centres.geojson \
            frontend/public/vancouver_community_centres.geojson \
            backend/data/vancouver_parks.geojson \
            frontend/public/vancouver_parks.geojson \
            backend/data/vancouver_drinking_fountains.geojson \
            frontend/public/vancouver_drinking_fountains.geojson \
            backend/data/admin_sources_config.json 2>/dev/null || true
          git clean -fd -e backend/.env -e .env -e frontend/.env.local -e backend/data/admin_sources_config.json -e backend/data/admin_layers_config.json

          # 還原 .env、前端環境變數、持久化執行狀態檔與合併管理員設定檔
          [ -f /tmp/godseye_root_env.bak ] && cp /tmp/godseye_root_env.bak .env || true
          [ -f /tmp/godseye_backend_env.bak ] && cp /tmp/godseye_backend_env.bak backend/.env || true
          [ -f /tmp/godseye_frontend_env.bak ] && cp /tmp/godseye_frontend_env.bak frontend/.env.local || true
          mkdir -p backend/data
          for rt_file in admin_schedule_history.json schedule_history_config.json system_logs.json system_logs_config.json stats_pv.json issue_reports.jsonl .admin_session_key system_maintenance.json admin_layers_config.json; do
            [ -f "/tmp/godseye_runtime_bak/$rt_file" ] && cp -f "/tmp/godseye_runtime_bak/$rt_file" "backend/data/$rt_file" || true
          done
          rm -rf /tmp/godseye_runtime_bak || true
          python3 backend/scripts/merge_admin_config.py || true

          # 如果 GitHub Secrets 有設定 TOMTOM_API_KEY，自動同步至 backend/.env 與根目錄 .env
          if [ -n "$TOMTOM_API_KEY" ]; then
            mkdir -p backend
            touch backend/.env
            if grep -q "^TOMTOM_API_KEY=" backend/.env 2>/dev/null; then
              sed -i "s|^TOMTOM_API_KEY=.*|TOMTOM_API_KEY=$TOMTOM_API_KEY|" backend/.env
            else
              echo "TOMTOM_API_KEY=$TOMTOM_API_KEY" >> backend/.env
            fi
            touch .env
            if grep -q "^TOMTOM_API_KEY=" .env 2>/dev/null; then
              sed -i "s|^TOMTOM_API_KEY=.*|TOMTOM_API_KEY=$TOMTOM_API_KEY|" .env
            else
              echo "TOMTOM_API_KEY=$TOMTOM_API_KEY" >> .env
            fi
            echo "✅ TOMTOM_API_KEY successfully synced from GitHub Secrets"
          fi

          # 如果 GitHub Secrets 有設定 ADMIN_API_SECRET，僅同步至後端與根目錄 .env (嚴禁寫入前端 NEXT_PUBLIC_* 防止密鑰外洩)
          if [ -n "$ADMIN_API_SECRET" ]; then
            mkdir -p backend
            touch backend/.env
            if grep -q "^ADMIN_API_SECRET=" backend/.env 2>/dev/null; then
              sed -i "s|^ADMIN_API_SECRET=.*|ADMIN_API_SECRET=$ADMIN_API_SECRET|" backend/.env
            else
              echo "ADMIN_API_SECRET=$ADMIN_API_SECRET" >> backend/.env
            fi
            touch .env
            if grep -q "^ADMIN_API_SECRET=" .env 2>/dev/null; then
              sed -i "s|^ADMIN_API_SECRET=.*|ADMIN_API_SECRET=$ADMIN_API_SECRET|" .env
            else
              echo "ADMIN_API_SECRET=$ADMIN_API_SECRET" >> .env
            fi
            echo "✅ ADMIN_API_SECRET successfully synced to backend only"
          fi

          # 如果 GitHub Secrets 有設定 ADMIN_PASSWORD，同步至後端與根目錄 .env
          if [ -n "$ADMIN_PASSWORD" ]; then
            mkdir -p backend
            touch backend/.env
            if grep -q "^ADMIN_PASSWORD=" backend/.env 2>/dev/null; then
              sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=$ADMIN_PASSWORD|" backend/.env
            else
              echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> backend/.env
            fi
            touch .env
            if grep -q "^ADMIN_PASSWORD=" .env 2>/dev/null; then
              sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=$ADMIN_PASSWORD|" .env
            else
              echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> .env
            fi
            echo "✅ ADMIN_PASSWORD successfully synced to backend"
          fi

          # 自動清除舊版曾寫入前端公開變數的機密項目，並收緊 .env 檔案權限
          [ -f .env ] && sed -i '/^NEXT_PUBLIC_ADMIN_API_SECRET=/d; /^NEXT_PUBLIC_TOMTOM_API_KEY=/d' .env || true
          [ -f frontend/.env.local ] && sed -i '/^NEXT_PUBLIC_ADMIN_API_SECRET=/d; /^NEXT_PUBLIC_TOMTOM_API_KEY=/d' frontend/.env.local || true
          [ -f .env ] && chmod 600 .env || true
          [ -f backend/.env ] && chmod 600 backend/.env || true
          rm -f /tmp/godseye_root_env.bak /tmp/godseye_backend_env.bak /tmp/godseye_frontend_env.bak /tmp/godseye_admin_cfg.bak || true
          
          echo "Current Git Commit on VM: $(git rev-parse HEAD)"

          # 重新建置並平滑升級前端與後端容器，杜絕多實例名稱衝突
          docker compose build frontend backend
          docker compose down --remove-orphans || true
          docker compose up -d db redis frontend backend nginx
          sleep 5
          docker compose ps
          docker compose logs --tail=20 backend

name: Deploy to OCI VM

on:
  push:
    branches: 
      - main
      - master
    paths-ignore:
      - '.github/workflows/update-*.yml'
      - '.github/workflows/oci-monthly-sync.yml'
      - 'backend/data/admin_sources_config.json'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      rollback_target:
        description: '緊急系統還原目標 (可輸入 Git Commit SHA、Tag 如 v2026.11.0，或 PREV 代表還原上一版本；留空則部署最新 main)'
        required: false
        default: ''

concurrency:
  group: deploy-oci-vm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Execute SSH commands on OCI VM
      uses: appleboy/ssh-action@v1.0.3
      env:
        TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
        ROLLBACK_TARGET: ${{ github.event.inputs.rollback_target }}
      with:
        host: ${{ secrets.OCI_HOST_IP }}
        username: ubuntu
        key: ${{ secrets.OCI_SSH_KEY }}
        envs: TOMTOM_API_KEY,ADMIN_API_SECRET,ADMIN_PASSWORD,THREADS_ACCESS_TOKEN,THREADS_USER_ID,THREADS_APP_SECRET,ROLLBACK_TARGET
        script: |
          set -e
          cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
          
          echo "Working directory: $(pwd)"

          git_fetch_retry() {
            local attempt=1
            local max_attempts=4
            while [ "$attempt" -le "$max_attempts" ]; do
              if git -c http.postBuffer=524288000 fetch "$@"; then
                return 0
              fi
              echo "⚠️ git fetch $* failed (attempt $attempt/$max_attempts), retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            return 1
          }

          # 修復先前後端容器以 root + mkstemp 寫入的 0600 檔案權限，確保 ubuntu 可讀取備份
          HOST_UID=$(id -u)
          HOST_GID=$(id -g)
          PERM_FIX_CMD="chown -R ${HOST_UID}:${HOST_GID} /app/data 2>/dev/null || true; find /app/data -type d -exec chmod 755 {} + 2>/dev/null || true; find /app/data -type f ! -name '.admin_session_key' ! -name '.threads_token_state.json' -exec chmod 644 {} + 2>/dev/null || true; [ -f /app/data/.admin_session_key ] && chmod 600 /app/data/.admin_session_key || true; [ -f /app/data/.threads_token_state.json ] && chmod 600 /app/data/.threads_token_state.json || true"
          RUNNING_BACKEND_CID=$(docker compose ps --status running -q backend 2>/dev/null || true)
          if [ -n "$RUNNING_BACKEND_CID" ]; then
            docker compose exec -T backend sh -c "$PERM_FIX_CMD" || true
          elif [ -n "$(docker compose images -q backend 2>/dev/null || true)" ]; then
            docker compose run -T --rm --no-deps --entrypoint sh backend -c "$PERM_FIX_CMD" || true
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo -n chown -R "${HOST_UID}:${HOST_GID}" backend/data frontend/public 2>/dev/null || true
            sudo -n find backend/data -type d -exec chmod 755 {} + 2>/dev/null || true
            sudo -n find backend/data -type f ! -name '.admin_session_key' ! -name '.threads_token_state.json' -exec chmod 644 {} + 2>/dev/null || true
            sudo -n chmod -R a+rX frontend/public 2>/dev/null || true
            [ -f backend/data/.admin_session_key ] && sudo -n chmod 600 backend/data/.admin_session_key 2>/dev/null || true
            [ -f backend/data/.threads_token_state.json ] && sudo -n chmod 600 backend/data/.threads_token_state.json 2>/dev/null || true
          fi
          
          # 備份保護本機 .env、前端環境變數與所有後台持久化執行狀態檔 (防止 git reset / origin/data 覆蓋)
          [ -f .env ] && cp .env /tmp/godseye_root_env.bak || true
          [ -f backend/.env ] && cp backend/.env /tmp/godseye_backend_env.bak || true
          [ -f frontend/.env.local ] && cp frontend/.env.local /tmp/godseye_frontend_env.bak || true
          [ -f backend/data/admin_sources_config.json ] && cp backend/data/admin_sources_config.json /tmp/godseye_admin_cfg.bak || true
          mkdir -p /tmp/godseye_runtime_bak
          for rt_file in admin_schedule_history.json schedule_history_config.json system_logs.json system_logs_config.json stats_pv.json issue_reports.jsonl .admin_session_key .threads_token_state.json system_maintenance.json admin_layers_config.json vancouver_yvr_flights.json vancouver_air_quality.geojson flo_ev_parks.json flo_ev_live_cache.json flo_ev_details_cache.json chargepoint_ev_devices.json chargepoint_ev_live_cache.json chargepoint_ev_details_cache.json vancouver_business_licences.json vancouver_building_permits.json vancouver_threads_posts.json; do
            [ -f "backend/data/$rt_file" ] && cp -f "backend/data/$rt_file" "/tmp/godseye_runtime_bak/$rt_file" || true
          done

          # 檢查是否有指定緊急系統還原目標
          if [ -n "$ROLLBACK_TARGET" ]; then
            echo "🚨 啟動緊急系統還原程序，目標：$ROLLBACK_TARGET ..."
            git_fetch_retry --all --tags
            if [ "$ROLLBACK_TARGET" = "PREV" ]; then
              git checkout HEAD~1
            else
              git checkout "$ROLLBACK_TARGET"
            fi
            echo "✅ 已切換至還原版本：$(git rev-parse HEAD)"
          else
            # 強制同步至遠端最新 commit，徹底避免本機快取與衝突阻止更新（含 503 重試）
            git_fetch_retry origin main
            git checkout main
            git reset --hard origin/main
          fi
          git_fetch_retry origin data:refs/remotes/origin/data 2>/dev/null || true
          git checkout refs/remotes/origin/data -- backend/data frontend/public 2>/dev/null || true
          # 確保核心圖資與後台設定以最新 main 分支為基準，防止 data 分支舊快取損壞屬性與格式
          git checkout HEAD -- \
            backend/data/vancouver_airports.geojson \
            frontend/public/vancouver_airports.geojson \
            backend/data/vancouver_bikeways.geojson \
            frontend/public/vancouver_bikeways.geojson \
            backend/data/vancouver_community_centres.geojson \
            frontend/public/vancouver_community_centres.geojson \
            backend/data/vancouver_parks.geojson \
            frontend/public/vancouver_parks.geojson \
            backend/data/vancouver_drinking_fountains.geojson \
            frontend/public/vancouver_drinking_fountains.geojson \
            backend/data/vancouver_impark.geojson \
            frontend/public/vancouver_impark.geojson \
            backend/data/vancouver_libraries.geojson \
            frontend/public/vancouver_libraries.geojson \
            backend/data/vancouver_snow_removal_routes.geojson \
            frontend/public/vancouver_snow_removal_routes.geojson \
            backend/data/vancouver_wildfire.geojson \
            frontend/public/vancouver_wildfire.geojson \
            backend/data/vancouver_fuel_cache.json \
            frontend/public/vancouver_fuel_cache.json \
            frontend/public/logo-mobile.jpg \
            frontend/public/logo-web.jpg \
            backend/data/admin_sources_config.json 2>/dev/null || true
          git clean -fd -e backend/.env -e .env -e frontend/.env.local -e backend/data/.admin_session_key -e backend/data/.threads_token_state.json -e backend/data/admin_schedule_history.json -e backend/data/schedule_history_config.json -e backend/data/system_logs.json -e backend/data/system_logs_config.json -e backend/data/stats_pv.json -e backend/data/issue_reports.jsonl -e backend/data/system_maintenance.json -e backend/data/admin_sources_config.json -e backend/data/admin_layers_config.json -e backend/data/vancouver_yvr_flights.json -e backend/data/vancouver_air_quality.geojson -e backend/data/flo_ev_parks.json -e backend/data/flo_ev_live_cache.json -e backend/data/flo_ev_details_cache.json -e backend/data/chargepoint_ev_devices.json -e backend/data/chargepoint_ev_live_cache.json -e backend/data/chargepoint_ev_details_cache.json -e backend/data/vancouver_business_licences.json -e backend/data/vancouver_building_permits.json -e backend/data/vancouver_threads_posts.json

          # 還原 .env、前端環境變數、持久化執行狀態檔與合併管理員設定檔
          [ -f /tmp/godseye_root_env.bak ] && cp /tmp/godseye_root_env.bak .env || true
          [ -f /tmp/godseye_backend_env.bak ] && cp /tmp/godseye_backend_env.bak backend/.env || true
          [ -f /tmp/godseye_frontend_env.bak ] && cp /tmp/godseye_frontend_env.bak frontend/.env.local || true
          mkdir -p backend/data
          for rt_file in admin_schedule_history.json schedule_history_config.json system_logs.json system_logs_config.json stats_pv.json issue_reports.jsonl .admin_session_key .threads_token_state.json system_maintenance.json admin_layers_config.json vancouver_yvr_flights.json vancouver_air_quality.geojson flo_ev_parks.json flo_ev_live_cache.json flo_ev_details_cache.json chargepoint_ev_devices.json chargepoint_ev_live_cache.json chargepoint_ev_details_cache.json vancouver_business_licences.json vancouver_building_permits.json vancouver_threads_posts.json; do
            [ -f "/tmp/godseye_runtime_bak/$rt_file" ] && cp -f "/tmp/godseye_runtime_bak/$rt_file" "backend/data/$rt_file" || true
          done
          rm -rf /tmp/godseye_runtime_bak || true
          python3 backend/scripts/merge_admin_config.py || true

          # 如果 GitHub Secrets 有設定 TOMTOM_API_KEY，自動同步至 backend/.env 與根目錄 .env
          if [ -n "$TOMTOM_API_KEY" ]; then
            mkdir -p backend
            touch backend/.env
            if grep -q "^TOMTOM_API_KEY=" backend/.env 2>/dev/null; then
              sed -i "s|^TOMTOM_API_KEY=.*|TOMTOM_API_KEY=$TOMTOM_API_KEY|" backend/.env
            else
              echo "TOMTOM_API_KEY=$TOMTOM_API_KEY" >> backend/.env
            fi
            touch .env
            if grep -q "^TOMTOM_API_KEY=" .env 2>/dev/null; then
              sed -i "s|^TOMTOM_API_KEY=.*|TOMTOM_API_KEY=$TOMTOM_API_KEY|" .env
            else
              echo "TOMTOM_API_KEY=$TOMTOM_API_KEY" >> .env
            fi
            echo "✅ TOMTOM_API_KEY successfully synced from GitHub Secrets"
          fi

          # 如果 GitHub Secrets 有設定 ADMIN_API_SECRET，僅同步至後端與根目錄 .env (嚴禁寫入前端 NEXT_PUBLIC_* 防止密鑰外洩)
          if [ -n "$ADMIN_API_SECRET" ]; then
            mkdir -p backend
            touch backend/.env
            if grep -q "^ADMIN_API_SECRET=" backend/.env 2>/dev/null; then
              sed -i "s|^ADMIN_API_SECRET=.*|ADMIN_API_SECRET=$ADMIN_API_SECRET|" backend/.env
            else
              echo "ADMIN_API_SECRET=$ADMIN_API_SECRET" >> backend/.env
            fi
            touch .env
            if grep -q "^ADMIN_API_SECRET=" .env 2>/dev/null; then
              sed -i "s|^ADMIN_API_SECRET=.*|ADMIN_API_SECRET=$ADMIN_API_SECRET|" .env
            else
              echo "ADMIN_API_SECRET=$ADMIN_API_SECRET" >> .env
            fi
            echo "✅ ADMIN_API_SECRET successfully synced to backend only"
          fi

          # 如果 GitHub Secrets 有設定 ADMIN_PASSWORD，同步至後端與根目錄 .env
          if [ -n "$ADMIN_PASSWORD" ]; then
            mkdir -p backend
            touch backend/.env
            if grep -q "^ADMIN_PASSWORD=" backend/.env 2>/dev/null; then
              sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=$ADMIN_PASSWORD|" backend/.env
            else
              echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> backend/.env
            fi
            touch .env
            if grep -q "^ADMIN_PASSWORD=" .env 2>/dev/null; then
              sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=$ADMIN_PASSWORD|" .env
            else
              echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> .env
            fi
            echo "✅ ADMIN_PASSWORD successfully synced to backend"
          fi

          # 如果 GitHub Secrets 有設定 THREADS_ACCESS_TOKEN / THREADS_USER_ID，僅同步至後端與根目錄 .env
          if [ -n "$THREADS_ACCESS_TOKEN" ]; then
            mkdir -p backend
            touch backend/.env .env
            for env_f in backend/.env .env; do
              if grep -q "^THREADS_ACCESS_TOKEN=" "$env_f" 2>/dev/null; then
                sed -i "s|^THREADS_ACCESS_TOKEN=.*|THREADS_ACCESS_TOKEN=$THREADS_ACCESS_TOKEN|" "$env_f"
              else
                echo "THREADS_ACCESS_TOKEN=$THREADS_ACCESS_TOKEN" >> "$env_f"
              fi
            done
            echo "✅ THREADS_ACCESS_TOKEN successfully synced to backend"
          fi
          if [ -n "$THREADS_USER_ID" ]; then
            mkdir -p backend
            touch backend/.env .env
            for env_f in backend/.env .env; do
              if grep -q "^THREADS_USER_ID=" "$env_f" 2>/dev/null; then
                sed -i "s|^THREADS_USER_ID=.*|THREADS_USER_ID=$THREADS_USER_ID|" "$env_f"
              else
                echo "THREADS_USER_ID=$THREADS_USER_ID" >> "$env_f"
              fi
            done
            echo "✅ THREADS_USER_ID successfully synced to backend"
          fi
          if [ -n "$THREADS_APP_SECRET" ]; then
            mkdir -p backend
            touch backend/.env .env
            for env_f in backend/.env .env; do
              if grep -q "^THREADS_APP_SECRET=" "$env_f" 2>/dev/null; then
                sed -i "s|^THREADS_APP_SECRET=.*|THREADS_APP_SECRET=$THREADS_APP_SECRET|" "$env_f"
              else
                echo "THREADS_APP_SECRET=$THREADS_APP_SECRET" >> "$env_f"
              fi
            done
            echo "✅ THREADS_APP_SECRET successfully synced to backend"
          fi

          # 自動清除舊版曾寫入前端公開變數的機密項目，並收緊 .env 檔案權限
          [ -f .env ] && sed -i '/^NEXT_PUBLIC_ADMIN_API_SECRET=/d; /^NEXT_PUBLIC_TOMTOM_API_KEY=/d' .env || true
          [ -f frontend/.env.local ] && sed -i '/^NEXT_PUBLIC_ADMIN_API_SECRET=/d; /^NEXT_PUBLIC_TOMTOM_API_KEY=/d' frontend/.env.local || true
          [ -f .env ] && chmod 600 .env || true
          [ -f backend/.env ] && chmod 600 backend/.env || true
          rm -f /tmp/godseye_root_env.bak /tmp/godseye_backend_env.bak /tmp/godseye_frontend_env.bak /tmp/godseye_admin_cfg.bak || true
          
          echo "Current Git Commit on VM: $(git rev-parse HEAD)"

          # 重新建置並平滑升級前端與後端容器，杜絕多實例名稱衝突
          docker compose build frontend backend
          docker compose down --remove-orphans || true
          docker compose up -d db redis frontend backend nginx
          sleep 5
          docker compose ps
          docker compose logs --tail=20 backend

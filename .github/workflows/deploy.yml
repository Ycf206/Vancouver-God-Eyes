name: Deploy to OCI VM

on:
  push:
    branches: 
      - main
      - master
    paths-ignore:
      - '.github/workflows/update-*.yml'
      - '.github/workflows/oci-monthly-sync.yml'
      - '.github/workflows/weekly-datasets.yml'
      - 'backend/data/admin_sources_config.json'
      - 'README.md'
      - 'docs/**'

concurrency:
  group: deploy-oci-vm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Execute SSH commands on OCI VM
      uses: appleboy/ssh-action@v1.0.3
      env:
        FLIGHTAWARE_API_KEY: ${{ secrets.FLIGHTAWARE_API_KEY }}
        TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
      with:
        host: ${{ secrets.OCI_HOST_IP }}
        username: ubuntu
        key: ${{ secrets.OCI_SSH_KEY }}
        envs: FLIGHTAWARE_API_KEY,TOMTOM_API_KEY,ADMIN_API_SECRET
        script: |
          set -e
          cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
          
          echo "Working directory: $(pwd)"
          
          # 備份保護本機 .env、前端環境變數與管理員排程設定檔
          [ -f .env ] && cp .env /tmp/godseye_root_env.bak || true
          [ -f backend/.env ] && cp backend/.env /tmp/godseye_backend_env.bak || true
          [ -f frontend/.env.local ] && cp frontend/.env.local /tmp/godseye_frontend_env.bak || true
          [ -f backend/data/admin_sources_config.json ] && cp backend/data/admin_sources_config.json /tmp/godseye_admin_cfg.bak || true

          # 強制同步至遠端最新 commit，徹底避免本機快取與衝突阻止更新
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git clean -fd -e backend/.env -e .env -e frontend/.env.local -e backend/data/admin_sources_config.json

          # 還原 .env、前端環境變數與管理員排程設定檔
          [ -f /tmp/godseye_root_env.bak ] && cp /tmp/godseye_root_env.bak .env || true
          [ -f /tmp/godseye_backend_env.bak ] && cp /tmp/godseye_backend_env.bak backend/.env || true
          [ -f /tmp/godseye_frontend_env.bak ] && cp /tmp/godseye_frontend_env.bak frontend/.env.local || true
          python3 backend/scripts/merge_admin_config.py || true

          # 如果 GitHub Secrets 有設定 FLIGHTAWARE_API_KEY，自動同步至 backend/.env 與根目錄 .env
          if [ -n "$FLIGHTAWARE_API_KEY" ]; then
            mkdir -p backend
            touch backend/.env
            if grep -q "^FLIGHTAWARE_API_KEY=" backend/.env 2>/dev/null; then
              sed -i "s|^FLIGHTAWARE_API_KEY=.*|FLIGHTAWARE_API_KEY=$FLIGHTAWARE_API_KEY|" backend/.env
            else
              echo "FLIGHTAWARE_API_KEY=$FLIGHTAWARE_API_KEY" >> backend/.env
            fi
            touch .env
            if grep -q "^FLIGHTAWARE_API_KEY=" .env 2>/dev/null; then
              sed -i "s|^FLIGHTAWARE_API_KEY=.*|FLIGHTAWARE_API_KEY=$FLIGHTAWARE_API_KEY|" .env
            else
              echo "FLIGHTAWARE_API_KEY=$FLIGHTAWARE_API_KEY" >> .env
            fi
            echo "✅ FLIGHTAWARE_API_KEY successfully synced from GitHub Secrets"
          fi

          # 如果 GitHub Secrets 有設定 TOMTOM_API_KEY，自動同步至 backend/.env 與根目錄 .env
          if [ -n "$TOMTOM_API_KEY" ]; then
            mkdir -p backend
            touch backend/.env
            if grep -q "^TOMTOM_API_KEY=" backend/.env 2>/dev/null; then
              sed -i "s|^TOMTOM_API_KEY=.*|TOMTOM_API_KEY=$TOMTOM_API_KEY|" backend/.env
            else
              echo "TOMTOM_API_KEY=$TOMTOM_API_KEY" >> backend/.env
            fi
            touch .env
            if grep -q "^TOMTOM_API_KEY=" .env 2>/dev/null; then
              sed -i "s|^TOMTOM_API_KEY=.*|TOMTOM_API_KEY=$TOMTOM_API_KEY|" .env
            else
              echo "TOMTOM_API_KEY=$TOMTOM_API_KEY" >> .env
            fi
            echo "✅ TOMTOM_API_KEY successfully synced from GitHub Secrets"
          fi

          # 如果 GitHub Secrets 有設定 ADMIN_API_SECRET，自動同步至 backend/.env、根目錄 .env 與 frontend/.env.local
          if [ -n "$ADMIN_API_SECRET" ]; then
            mkdir -p backend
            touch backend/.env
            if grep -q "^ADMIN_API_SECRET=" backend/.env 2>/dev/null; then
              sed -i "s|^ADMIN_API_SECRET=.*|ADMIN_API_SECRET=$ADMIN_API_SECRET|" backend/.env
            else
              echo "ADMIN_API_SECRET=$ADMIN_API_SECRET" >> backend/.env
            fi
            touch .env
            if grep -q "^ADMIN_API_SECRET=" .env 2>/dev/null; then
              sed -i "s|^ADMIN_API_SECRET=.*|ADMIN_API_SECRET=$ADMIN_API_SECRET|" .env
            else
              echo "ADMIN_API_SECRET=$ADMIN_API_SECRET" >> .env
            fi
            if grep -q "^NEXT_PUBLIC_ADMIN_API_SECRET=" .env 2>/dev/null; then
              sed -i "s|^NEXT_PUBLIC_ADMIN_API_SECRET=.*|NEXT_PUBLIC_ADMIN_API_SECRET=$ADMIN_API_SECRET|" .env
            else
              echo "NEXT_PUBLIC_ADMIN_API_SECRET=$ADMIN_API_SECRET" >> .env
            fi
            mkdir -p frontend
            touch frontend/.env.local
            if grep -q "^NEXT_PUBLIC_ADMIN_API_SECRET=" frontend/.env.local 2>/dev/null; then
              sed -i "s|^NEXT_PUBLIC_ADMIN_API_SECRET=.*|NEXT_PUBLIC_ADMIN_API_SECRET=$ADMIN_API_SECRET|" frontend/.env.local
            else
              echo "NEXT_PUBLIC_ADMIN_API_SECRET=$ADMIN_API_SECRET" >> frontend/.env.local
            fi
            echo "✅ ADMIN_API_SECRET successfully synced to backend and frontend from GitHub Secrets"
          fi
          
          echo "Current Git Commit on VM: $(git rev-parse HEAD)"

          # 重新建置並平滑升級前端與後端容器，杜絕多實例名稱衝突
          docker compose build frontend backend
          docker compose down --remove-orphans || true
          docker compose up -d frontend backend nginx

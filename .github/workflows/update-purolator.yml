name: Update Purolator 門市與自取據點 (每月更新 1 次)

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

concurrency:
  group: update-purolator
  cancel-in-progress: true

jobs:
  update-purolator:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Layer Sync Script (Purolator)
        run: |
          python backend/scripts/layers/update_purolator.py

      - name: Commit and Push Updated GeoJSON
        id: git_push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/vancouver_purolator.geojson frontend/public/vancouver_purolator.geojson
          if git diff --staged --quiet; then
            echo "No updates detected for Purolator."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): auto-update Purolator locations [skip ci]"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git push
          fi

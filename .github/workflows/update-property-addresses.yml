name: Update 門牌地址檢索索引 (每週)

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: update-property-addresses
  cancel-in-progress: true

jobs:
  update-property-addresses:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Property Addresses Update Script
        run: |
          python backend/scripts/layers/update_property_addresses.py

      - name: Commit and Push Updated Metadata
        id: git_push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/vancouver_property_addresses_meta.json
          if git diff --staged --quiet; then
            echo "No updates detected for 門牌地址檢索索引."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): auto-update 門牌地址檢索索引 [skip ci]"
            git push origin HEAD:data --force
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync to OCI VM
        if: steps.git_push.outputs.has_changes == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "🔄 同步門牌地址索引至 OCI 伺服器..."
            cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
            git fetch origin data 2>/dev/null || true
            git checkout origin/data -- backend/data frontend/public 2>/dev/null || true origin main
            echo "✅ 門牌地址索引 OCI 同步完成！"

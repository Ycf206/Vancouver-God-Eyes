name: Update 共享單車 (Mobi Shared Bikes) (每小時即時車況)

on:
  schedule:
    # 每小時整點執行 (UTC)
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: update-shared-bikes-hourly
  cancel-in-progress: true

jobs:
  update-shared-bikes-hourly:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Latest GeoJSON Cache from data branch
        run: |
          git fetch origin data:refs/remotes/origin/data 2>/dev/null || true
          git checkout origin/data -- backend/data frontend/public 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Mobi 共享單車 hourly status update
        run: |
          python backend/scripts/layers/update_shared_bikes.py --mode status

      - name: Commit and push changes
        id: git_push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/vancouver_shared_bikes.geojson frontend/public/vancouver_shared_bikes.geojson
          if git diff --staged --quiet; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): auto-update Mobi 共享單車即時車況 (Shared Bikes) [skip ci]"
            git push origin HEAD:data --force
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync Updated Data to OCI VM
        if: steps.git_push.outputs.has_changes == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "🔄 同步最新 Mobi 共享單車即時站點 圖資至 OCI 伺服器..."
            cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
            git fetch origin data 2>/dev/null || true
            git checkout origin/data -- backend/data frontend/public 2>/dev/null || true
            mkdir -p backend/data frontend/public
            sudo docker compose restart backend || sudo docker-compose restart backend || true
            echo "✅ OCI 伺服器 Mobi 共享單車即時站點 圖資同步完成！"

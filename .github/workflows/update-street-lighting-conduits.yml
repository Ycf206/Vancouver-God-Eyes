name: Update 路燈電網管道 (每年)

on:
  schedule:
    - cron: '0 0 1 1 *'
  workflow_dispatch:

concurrency:
  group: update-street-lighting-conduits
  cancel-in-progress: true

jobs:
  update-street-lighting-conduits:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Layer Sync Script (路燈電網管道)
        run: |
          python backend/scripts/layers/update_street_lighting_conduits.py

      - name: Commit and Push Updated GeoJSON
        id: git_push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/vancouver_street_lighting_conduits.geojson frontend/public/vancouver_street_lighting_conduits.geojson
          if git diff --staged --quiet; then
            echo "No updates detected for 路燈電網管道."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): auto-update 路燈電網管道 dataset [skip ci]"
            git push origin HEAD:data --force
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync Updated GeoJSON to OCI VM
        if: steps.git_push.outputs.has_changes == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "🔄 同步最新 路燈電網管道 圖資至 OCI 伺服器..."
            cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
            git fetch origin data 2>/dev/null || true
            git checkout origin/data -- backend/data frontend/public 2>/dev/null || true
            echo "✅ OCI 伺服器 路燈電網管道 圖資同步完成！"

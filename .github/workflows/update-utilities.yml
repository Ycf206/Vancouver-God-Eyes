name: Quarterly Utilities Cron Update (每3個月更新)

on:
  schedule:
    # 每年 1、4、7、10 月 1 日 03:00 UTC 自動執行 (每 3 個月一次)
    - cron: '0 3 1 1,4,7,10 *'
  workflow_dispatch: # 支援在 GitHub 網頁介面一鍵手動觸發立即更新

jobs:
  update-utilities:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Utilities Update Script (自來水管道與污水管道 每3個月更新)
        run: |
          python backend/scripts/update_utilities.py

      - name: Commit and Push Updated Utilities GeoJSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/vancouver_water_distribution_mains.geojson frontend/public/vancouver_water_distribution_mains.geojson backend/data/vancouver_sewer_mains.geojson frontend/public/vancouver_sewer_mains.geojson backend/data/last_utilities_update.json
          if git diff --staged --quiet; then
            echo "No utilities updates detected from Vancouver Open Data API."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): auto-update quarterly utilities (3-month cron) [skip ci]"
            git push origin main
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        id: git_push

      - name: Sync Updated GeoJSON to OCI VM
        if: steps.git_push.outputs.has_changes == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "🔄 同步最新公共事業管道 GeoJSON 資料至 OCI 伺服器..."
            cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
            git pull
            echo "✅ OCI 伺服器資料檔案同步完成！"

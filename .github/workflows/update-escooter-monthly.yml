name: Update 共享滑板車 (Lime E-Scooters) (每月站點資訊)

on:
  schedule:
    # 每月 1 日 04:30 (UTC) 執行
    - cron: '30 4 1 * *'
  workflow_dispatch:

concurrency:
  group: update-escooter-monthly
  cancel-in-progress: true

jobs:
  update-escooter-monthly:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Latest GeoJSON Cache from data branch
        run: |
          git fetch origin data:refs/remotes/origin/data 2>/dev/null || true
          git checkout origin/data -- backend/data frontend/public 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Lime 共享滑板車 monthly stations update
        run: |
          python backend/scripts/layers/update_escooter.py --mode stations

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/vancouver_escooter.geojson frontend/public/vancouver_escooter.geojson
          if git diff --staged --quiet; then
            echo "No changes detected"
          else
            git commit -m "chore(data): monthly-sync Lime 共享滑板車站點資訊 (E-Scooters) [skip ci]"
            git push origin HEAD:data --force
          fi

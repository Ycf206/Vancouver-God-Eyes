name: Semi-Annual Open Data Cron Update (每6個月更新)

on:
  schedule:
    # 每年 1 月 1 日與 7 月 1 日 03:00 UTC (格林威治時間) 自動執行 (每 6 個月一次)
    - cron: '0 3 1 1,7 *'
  workflow_dispatch: # 支援在 GitHub 網頁介面一鍵手動觸發立即更新

jobs:
  update-datasets:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Open Data Update Script (9 Datasets)
        run: |
          python backend/scripts/update_open_data.py

      - name: Commit and Push Updated GeoJSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/*.geojson frontend/public/*.geojson backend/data/last_open_data_update.json
          if git diff --staged --quiet; then
            echo "No dataset updates detected from Vancouver Open Data API."
          else
            git commit -m "chore(data): auto-update semi-annual open datasets (6-month cron) [skip ci]"
            git push origin main
          fi

name: Update 自動體外心臟去顫器 (每季 (3 個月))

on:
  schedule:
    - cron: '0 0 1 */3 *'
  workflow_dispatch:

concurrency:
  group: update-aed
  cancel-in-progress: true

jobs:
  update-aed:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Layer Sync Script (自動體外心臟去顫器)
        run: |
          python backend/scripts/layers/update_aed.py

      - name: Commit and Push Updated GeoJSON
        id: git_push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/vancouver_aed.geojson frontend/public/vancouver_aed.geojson
          if git diff --staged --quiet; then
            echo "No updates detected for 自動體外心臟去顫器."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): auto-update 自動體外心臟去顫器 dataset [skip ci]"
            git push origin main
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync Updated GeoJSON to OCI VM
        if: steps.git_push.outputs.has_changes == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "🔄 同步最新 自動體外心臟去顫器 圖資至 OCI 伺服器..."
            cd ~/Vancouver-God-Eyes || cd ~/vancouver-gods-eye
            git pull
            echo "✅ OCI 伺服器 自動體外心臟去顫器 圖資同步完成！"

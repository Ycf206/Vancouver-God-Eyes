x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  db:
    image: kartoza/postgis:15-3.4
    environment:
      POSTGRES_USER: gods_eye_user
      POSTGRES_PASSWORD: password
      POSTGRES_PASS: password
      POSTGRES_DB: gods_eye
      POSTGRES_DBNAME: gods_eye
    # 關閉 5432 外網暴露，保護資料庫安全，僅允許 Docker 容器內部連線
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    # 關閉 6379 外網暴露，保護快取安全，僅允許 Docker 容器內部連線
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging: *default-logging

  backend:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - DATABASE_URL=postgresql://gods_eye_user:password@db:5432/gods_eye
      - REDIS_URL=redis://redis:6379/0
      - FLIGHTAWARE_API_KEY=${FLIGHTAWARE_API_KEY:-}
      - FLIGHTAWARE_MAX_MONTHLY_CALLS=${FLIGHTAWARE_MAX_MONTHLY_CALLS:-480}
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY:-}
      - TOMTOM_API_KEY=${TOMTOM_API_KEY:-}
      - ADMIN_API_SECRET=${ADMIN_API_SECRET:-}
      - WORKERS=2
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_ADMIN_API_SECRET=${NEXT_PUBLIC_ADMIN_API_SECRET:-${ADMIN_API_SECRET:-}}
    expose:
      - "3000"
    depends_on:
      - backend
    environment:
      - NODE_OPTIONS=--max-old-space-size=2048
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXT_PUBLIC_TOMTOM_API_KEY=${TOMTOM_API_KEY:-}
      - NEXT_PUBLIC_ADMIN_API_SECRET=${NEXT_PUBLIC_ADMIN_API_SECRET:-${ADMIN_API_SECRET:-}}
      - NEXT_PUBLIC_STRIPE_PAYMENT_LINK=${NEXT_PUBLIC_STRIPE_PAYMENT_LINK:-https://donate.stripe.com/6oU14g6Y7fgig6N1UfcMM00}
      - NEXT_PUBLIC_BUYMEACOFFEE_URL=${NEXT_PUBLIC_BUYMEACOFFEE_URL:-}
      - NEXT_PUBLIC_PAYPAL_URL=${NEXT_PUBLIC_PAYPAL_URL:-}
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:

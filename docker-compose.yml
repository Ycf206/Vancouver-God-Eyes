services:
  db:
    image: kartoza/postgis:15-3.4
    environment:
      POSTGRES_USER: gods_eye_user
      POSTGRES_PASSWORD: password
      POSTGRES_PASS: password
      POSTGRES_DB: gods_eye
      POSTGRES_DBNAME: gods_eye
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - DATABASE_URL=postgresql://gods_eye_user:password@db:5432/gods_eye
      - REDIS_URL=redis://redis:6379/0
      - FLIGHTAWARE_API_KEY=${FLIGHTAWARE_API_KEY:-}
      - FLIGHTAWARE_MAX_MONTHLY_CALLS=${FLIGHTAWARE_MAX_MONTHLY_CALLS:-480}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_STRIPE_PAYMENT_LINK=${NEXT_PUBLIC_STRIPE_PAYMENT_LINK:-}
      - NEXT_PUBLIC_BUYMEACOFFEE_URL=${NEXT_PUBLIC_BUYMEACOFFEE_URL:-}
      - NEXT_PUBLIC_PAYPAL_URL=${NEXT_PUBLIC_PAYPAL_URL:-}
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

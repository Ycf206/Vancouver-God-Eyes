services:
  db:
    image: kartoza/postgis:15-3.4
    environment:
      POSTGRES_USER: gods_eye_user
      POSTGRES_PASSWORD: password
      POSTGRES_PASS: password
      POSTGRES_DB: gods_eye
      POSTGRES_DBNAME: gods_eye
    # 關閉 5432 外網暴露，保護資料庫安全，僅允許 Docker 容器內部連線
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 關閉 6379 外網暴露，保護快取安全，僅允許 Docker 容器內部連線
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - DATABASE_URL=postgresql://gods_eye_user:password@db:5432/gods_eye
      - REDIS_URL=redis://redis:6379/0
      - FLIGHTAWARE_API_KEY=${FLIGHTAWARE_API_KEY:-}
      - FLIGHTAWARE_MAX_MONTHLY_CALLS=${FLIGHTAWARE_MAX_MONTHLY_CALLS:-480}
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY:-}
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose:
      - "3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXT_PUBLIC_STRIPE_PAYMENT_LINK=${NEXT_PUBLIC_STRIPE_PAYMENT_LINK:-https://donate.stripe.com/6oU14g6Y7fgig6N1UfcMM00}
      - NEXT_PUBLIC_BUYMEACOFFEE_URL=${NEXT_PUBLIC_BUYMEACOFFEE_URL:-}
      - NEXT_PUBLIC_PAYPAL_URL=${NEXT_PUBLIC_PAYPAL_URL:-}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
